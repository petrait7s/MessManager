name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Signing key (secret or throwaway)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.keystore
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v -keystore $RUNNER_TEMP/release.keystore -alias messmanager -keyalg RSA -keysize 2048 -validity 10000 -storepass messmanager -keypass messmanager -dname "CN=MessManager"
            echo "KEYSTORE_PASSWORD=messmanager" >> $GITHUB_ENV
            echo "KEY_ALIAS=messmanager" >> $GITHUB_ENV
            echo "KEY_PASSWORD=messmanager" >> $GITHUB_ENV
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
      - name: Test and build
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apks-and-reports
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/reports/tests/**
            app/build/test-results/**
      - name: Publish release
        if: github.ref == 'refs/heads/main' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MessManager build ${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
